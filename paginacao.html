{% if pagina.has_other_pages %}

<nav
  class="pagination"
  aria-label="Paginação"
>

  {% if pagina.has_previous %}

    <a href="?{{ parametros }}&page={{ pagina.previous_page_number }}">
      ← Anterior
    </a>

  {% endif %}


  <span>
    Página {{ pagina.number }}
    de
    {{ pagina.paginator.num_pages }}
  </span>


  {% if pagina.has_next %}

    <a href="?{{ parametros }}&page={{ pagina.next_page_number }}">
      Próxima →
    </a>

  {% endif %}

</nav>

{% endif %}
